<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOOTOCASSION FIT</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0f14;
color:#f5f7fa
}

header{
background:#10161e;
border-bottom:1px solid #293340;
padding:14px 16px;
position:sticky;
top:0;
z-index:5
}

nav{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.logo{
font-weight:900;
font-size:21px;
letter-spacing:-.5px;
line-height:1;
}

.logo-main{
color:#f5f7fa;
}

.logo-accent{
color:#63d5ff;
}

.logo small{
display:block;
color:#9db3c5;
font-size:10px;
font-weight:600;
letter-spacing:1.2px;
margin-top:5px;
}

main{
max-width:1100px;
margin:auto;
padding:22px 16px
}

.hero{
padding:20px 0 18px;
background:linear-gradient(135deg,#111821,#0d1721);
border:1px solid #202b36;
border-radius:20px;
padding:24px 20px;
margin-bottom:18px;
box-sizing:border-box;
position:relative;
overflow:hidden;
box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 12px 30px rgba(0,0,0,.18);
}
.hero::after{
content:"";
position:absolute;
width:180px;
height:180px;
right:-70px;
top:-80px;
background:#63d5ff;
opacity:.08;
border-radius:50%;
filter:blur(8px);
pointer-events:none;
}

.hero h1{
font-size:30px;
line-height:1.08;
margin:0 0 10px;
font-weight:900;
letter-spacing:-1px;
color:#f5f7fa;
   }

.hero p{
color:#9aa8b7;
font-size:14px;
margin:0 0 20px;
line-height:1.55;
max-width:520px;
   }

button{
padding:11px 15px;
border-radius:10px;
font-weight:700;
cursor:pointer
}

.primary{
background:#63d5ff;
color:#071018;
border:0;
box-shadow:0 6px 18px rgba(99,213,255,.18);
   }

.outline{
background:#151d27;
color:#fff;
border:1px solid #364252
}

.search{
margin:18px 0 14px;
position:relative;
}

.search input{
width:100%;
box-sizing:border-box;
background:#151c25;
border:1px solid #293442;
border-radius:14px;
padding:14px 16px;
color:#f5f7fa;
font-size:14px;
outline:none;
}

.search input:focus{
border-color:#63d5ff;
box-shadow:0 0 0 3px rgba(99,213,255,.10);
}

.search input::placeholder{
color:#7f8b9a;
   }

input,select,textarea{
width:100%;
background:#111821;
color:#fff;
border:1px solid #303b49;
border-radius:10px;
padding:12px;
font-size:15px
}

.filters{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin-bottom:20px;
}

.filters select{
background:#151c25;
border:1px solid #293442;
border-radius:12px;
padding:11px 10px;
font-size:13px;
color:#dfe8f0;
}

.filters select:focus{
border-color:#63d5ff;
outline:none;
box-shadow:0 0 0 3px rgba(99,213,255,.08);
}

.catalog{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px
}

.card{
background:#111821;
border:1px solid #202b36;
border-radius:16px;
overflow:hidden;
transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}

.card:hover{
transform:translateY(-3px);
border-color:#63d5ff;
box-shadow:0 8px 25px rgba(0,0,0,.25);
}
   
.shirt{
  height:240px;
  background:#0f151d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  color:#748092;
  padding:3px;
  box-sizing:border-box;
  position:relative;
}

.shirt img{
  width:calc(100% + 8px);
  max-width:none;
  height:100%;
  margin-left:-4px;
  object-fit:contain;
  border-radius:10px;
}

@media(max-width:520px){
  .shirt{
    height:220px;
  }
   }

.favorite{
position:absolute;
top:10px;
right:10px;
width:34px;
height:34px;
padding:0;
border-radius:50%;
background:rgba(7,16,24,.78);
border:1px solid rgba(255,255,255,.10);
color:#fff;
font-size:20px;
display:flex;
align-items:center;
justify-content:center;
backdrop-filter:blur(6px);
z-index:2;
}

.shirt img{
width:100%;
height:100%;
object-fit:contain;
border-radius:10px;
}
   
.info{
padding:13px;
}

.info h3{
margin:0 0 6px;
font-size:15px;
line-height:1.25;
font-weight:800;
}

.info .muted{
font-size:12px;
color:#8e9baa;
line-height:1.4;
}

.muted,.note{
color:#9ca8b6;
font-size:13px
}

.price{
font-size:19px;
font-weight:900;
color:#63d5ff;
margin:10px 0 5px;
letter-spacing:-.3px;
}

.tag{
display:inline-block;
padding:5px 9px;
border-radius:999px;
background:rgba(99,213,255,.10);
border:1px solid rgba(99,213,255,.18);
color:#9edfff;
font-size:11px;
font-weight:700;
margin:4px 2px;
   }

.warn{
background:rgba(255,190,80,.10);
border-color:rgba(255,190,80,.22);
color:#ffd88a;
   }

.empty{
text-align:center;
color:#9ca8b6;
padding:40px;
border:1px dashed #303b49;
border-radius:15px;
grid-column:1/-1
}


.feed-end-message{
  margin:28px 0 110px;
  padding:25px 18px;
  text-align:center;
  border:1px solid #263746;
  border-radius:20px;
  background:linear-gradient(145deg,#111c27,#0d141c);
  color:#f4f7fb;
}
.feed-end-icon{font-size:30px;margin-bottom:9px}
.feed-end-message strong{display:block;font-size:17px;line-height:1.4}
.feed-end-message p{margin:8px 0 0;color:#9eafbf;font-size:14px;line-height:1.5}

/* =========================
   NAVIGATION STYLE TIKTOK — PAGES COMPTE/FAVORIS
========================= */
.tab-page{
  padding:0 !important;
  align-items:stretch !important;
  justify-content:stretch !important;
  background:#07110d !important;
  z-index:9000 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
}

.tab-page .box{
  width:100% !important;
  max-width:720px !important;
  min-height:100vh !important;
  box-sizing:border-box;
  margin:0 auto !important;
  padding:18px 18px 125px !important;
  border:0 !important;
  border-radius:0 !important;
  background:#07110d !important;
  box-shadow:none !important;
}

.tab-page .tab-page-brand{
  display:flex;
  align-items:center;
  gap:0;
  margin:4px 0 22px;
  font-weight:900;
  font-size:25px;
  letter-spacing:-.8px;
  color:#eaf2ed;
}

.tab-page .tab-page-brand .logo-accent{
  color:#20e879;
}

.tab-page .close{
  display:none !important;
}

/* La barre TikTok reste au-dessus de toutes les pages */
.bottom-nav{
  z-index:20000 !important;
  touch-action:manipulation;
}

/* Les pages Compte / Cesta doivent pouvoir défiler indépendamment
   de la page principale, même avec la barre fixe en bas. */
.tab-page.show{
  display:block !important;
  height:100dvh;
  max-height:100dvh;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  touch-action:pan-y;
}

.tab-page.show .box{
  min-height:0 !important;
  height:auto !important;
  max-height:none !important;
  padding-bottom:190px !important;
}

@media(max-width:520px){
  .tab-page .box{
    padding:14px 16px 190px !important;
  }
  .tab-page .tab-page-brand{
    font-size:23px;
    margin-bottom:18px;
  }
}

.modal{
display:none;
position:fixed;
inset:0;
background:#000b;
z-index:10000;
padding:calc(18px + env(safe-area-inset-top, 0px)) 18px calc(110px + env(safe-area-inset-bottom, 0px));
overflow-y:auto;
overflow-x:hidden;
-webkit-overflow-scrolling:touch;
box-sizing:border-box;
}
.modal.show{min-height:100dvh;max-height:100dvh;overscroll-behavior:contain;}
.modal.show>.box{margin:0 auto;align-self:flex-start;box-sizing:border-box;width:min(650px,100%);max-width:100%;}
@media(max-width:520px){.modal{padding-left:12px;padding-right:12px}.modal.show>.box{padding:18px 16px 28px;}}

.modal.show{
display:flex;
justify-content:center
}

.box{
width:min(650px,100%);
background:#10161e;
border:1px solid #303b49;
border-radius:16px;
padding:20px;
margin:20px 0
}

.close{
float:right;
background:transparent;
color:#fff;
border:0;
font-size:24px
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

label{
display:block;
color:#b9c2ce;
font-size:13px;
margin:12px 0 6px
}

textarea{min-height:90px}

.photos{
display:flex;
gap:8px;
margin-top:10px;
flex-wrap:wrap
}

.preview{
width:90px;
height:90px;
object-fit:cover;
border-radius:10px
}

.gallery{
display:block;
width:100%;
padding:14px;
background:#151d27;
border:1px solid #526071;
border-radius:10px;
color:#fff;
font-weight:700;
text-align:center;
cursor:pointer;
font-size:15px
}

.gallery:hover{
background:#202a36
}

#photos{
position:absolute;
width:1px;
height:1px;
opacity:0;
pointer-events:none
}

.fee{
background:#151e28;
border-radius:12px;
padding:14px;
line-height:1.8
}

.total{
font-size:22px;
font-weight:900
}

.creatorBox{
margin-top:18px;
background:#151e28;
border-radius:12px;
overflow:hidden
}

.creatorButton{
width:100%;
background:transparent;
color:#fff;
border:0;
text-align:left;
padding:16px;
font-size:15px
}

.creatorContent{
display:none;
padding:0 14px 14px
}

.creatorContent.show{
display:block
}

.creatorContent input{
margin:8px 0
}

.authStatus{
font-size:12px;
color:#9ca8b6;
margin-top:5px;
text-align:right
}

.success{
color:#7ee2a8
}

.error{
color:#ff8f8f
}

@media(max-width:800px){

.filters{
grid-template-columns:1fr 1fr
}

.catalog{
grid-template-columns:1fr 1fr
}

}

@media(max-width:520px){

.catalog{grid-template-columns:1fr 1fr}

.row{
grid-template-columns:1fr
}

.hero h1{
font-size:28px
}

nav{
align-items:flex-start
}

}

/* =========================
   FICHA PRODUCTO — PREMIUM
========================= */

#productDetail{
  padding:0;
  align-items:flex-end;
  z-index:10000;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

#productDetail .box{
  position:relative;
  width:min(720px,100%);
  max-height:96vh;
  margin:0;
  padding:0 0 125px;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  border:1px solid #293443;
  border-bottom:0;
  border-radius:26px 26px 0 0;
  overflow-x:hidden;
  background:#0f151d;
  box-shadow:0 -15px 50px #0009;
}

/* Bouton fermer */

#productDetail .close{
  position:absolute;
  right:16px;
  top:16px;
  z-index:20;
  width:44px;
  height:44px;
  padding:0;
  border:1px solid #ffffff33;
  border-radius:50%;
  background:#0b0f14cc;
  color:#fff;
  font-size:25px;
  line-height:44px;
  text-align:center;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

/* Galerie */

#productGallery{
  margin:0;
  border-radius:0 !important;
  background:#090d12 !important;
  position:relative;
}

#productGallery > div{
  height:min(52vh,480px);
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  -ms-overflow-style:none;
  overscroll-behavior-x:contain;
}

#productGallery > div::-webkit-scrollbar{
  display:none;
}

#productGallery img{
  width:100% !important;
  min-width:100%;
  height:100% !important;
  flex-shrink:0;
  object-fit:contain !important;
  padding:10px 0;
  box-sizing:border-box;
  scroll-snap-align:center;
  background:#090d12;
}

/* Dégradé en bas de la photo */

#productGallery::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:90px;
  pointer-events:none;
  background:linear-gradient(
    transparent,
    rgba(9,13,18,.65)
  );
}

/* Indicateurs */

#productDots{
  position:relative;
  z-index:5;
  margin:-3px 0 0 !important;
  height:18px;
  color:#fff;
  font-size:10px;
  letter-spacing:4px;
  text-align:center;
}

/* Informations */

#productDetailInfo{
  padding:4px 20px 0;
}

#productDetailInfo h2{
  margin:8px 0 5px;
  font-size:27px;
  line-height:1.15;
  font-weight:900;
  letter-spacing:-.5px;
}

#productDetailInfo .muted{
  margin:0 0 10px;
  color:#aab5c3;
  font-size:14px;
}

#productDetailInfo .tag{
  padding:6px 10px;
  border-radius:8px;
  background:#1b2531;
  color:#e8edf3;
}

#productDetailInfo .price{
  margin:14px 0 4px;
  font-size:32px;
  font-weight:900;
  letter-spacing:-1px;
}

/* Bouton achat */

#productActionBar{position:relative;z-index:5;padding-bottom:12px}
#productActionBar button{width:100%;box-shadow:0 8px 25px #0004;white-space:normal;line-height:1.2}
#productCartButton:active,#productBuyButton:active{transform:scale(.98)}
#productBuyButton{border:0;}
@media(max-width:380px){#productActionBar{gap:7px;padding-left:12px;padding-right:12px}#productActionBar button{font-size:14px;padding:10px 7px}}

#productBuyButton:active{
  transform:scale(.98);
}

/* Mobile */

@media(max-width:520px){

  #productDetail{
    padding:0;
  }

  #productDetail .box{
    width:100%;
    max-height:97vh;
    border-radius:24px 24px 0 0;
  }

  #productGallery > div{
    height:44vh;
  }

  #productDetailInfo{
    padding-left:20px;
    padding-right:20px;
  }

  #productDetailInfo h2{
    font-size:25px;
  }

  #productDetailInfo .price{
    font-size:30px;
  }

  #productBuyButton{
    height:54px;
  }

  }

/* Achat : la fiche de paiement doit pouvoir défiler sur mobile */
#buy{
  align-items:flex-start;

  }

  }

.purchase-login-box{
  max-height:calc(100vh - 36px);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.stock{
  margin-top:8px;
  font-size:13px;
  font-weight:700;
  color:#20e879;
}

/* Compte mobile, style profil social */

}
